# Build & publish awshound on push to main (issue #7).
#
# Two artifacts, both from the repo Dockerfile:
#   * container image -> ghcr.io/awshound/awshound  (multi-arch, tagged
#                        latest / beta / sha-<short>)
#   * standalone binaries -> linux, darwin and windows (amd64 + arm64), attached
#                        to a rolling `beta` prerelease, each with a .sha256.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # create/update the `beta` release + attach binaries
  packages: write   # push the image to ghcr.io

jobs:
  image:
    name: image → ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/awshound/awshound
          tags: |
            type=raw,value=beta,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: binary (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: "" }
          - { goos: linux,   goarch: arm64, ext: "" }
          - { goos: darwin,  goarch: amd64, ext: "" }
          - { goos: darwin,  goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build binary via Docker
        run: |
          docker buildx build \
            --target export \
            --build-arg TARGETOS=${{ matrix.goos }} \
            --build-arg TARGETARCH=${{ matrix.goarch }} \
            --output type=local,dest=dist .
          # The export stage always names the file `awshound`; add the platform
          # suffix (and .exe on windows) for the release download.
          name="awshound-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          mv dist/awshound "$name"
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: awshound-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            awshound-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            awshound-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256
          if-no-files-found: error

  release:
    name: publish beta release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Collect binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Update rolling `beta` prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: beta (main)
          prerelease: true
          # Roll the tag to the latest main commit each run.
          target_commitish: ${{ github.sha }}
          body: >
            Rolling build from the latest push to `main`
            (${{ github.sha }}). Not a stable release.
          files: dist/*
